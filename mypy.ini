# mypy checks the types of the Python in tools/ (`mise run lint`). The tools use the
# standard library only.
[mypy]
python_version = 3.15
files = tools
# A function with no annotation is an error, as an untyped declaration is in GDScript.
disallow_untyped_defs = True
# The body of a function still gets checked where it has no annotation.
check_untyped_defs = True
# A function declared to return a type may not return Any.
warn_return_any = True
# A `# type: ignore` that no longer hides anything is an error.
warn_unused_ignores = True
